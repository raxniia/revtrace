[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revtrace"
version = "0.1.0"
description = "Agentic sales investigation: hypotheses, evidence, verdicts, actions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "mcp>=2.0",
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
revtrace = "revtrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/revtrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
